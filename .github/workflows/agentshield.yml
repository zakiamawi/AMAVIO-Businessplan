name: AgentShield Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: AgentShield Security Scan
        run: |
          npx -y ecc-agentshield@1.4.0 scan \
            --path . \
            --min-severity medium \
            --baseline .github/agentshield-baseline.json \
            --gate \
            --format terminal
